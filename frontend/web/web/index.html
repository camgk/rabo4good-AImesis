<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AImesis care-team app: paediatric CINV decision support (advisory only).">
  <meta name="theme-color" content="#0F766E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AImesis Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AImesis — Care team</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F6; }
    @media (prefers-color-scheme: dark) { html, body { background: #0E1514; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0F766E; }
    #splash .mark { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
    #splash .sub { margin-top: 6px; font-size: 14px; color: #5B6B68; }
  </style>
</head>
<body>
  <div id="splash"><div class="mark">AImesis</div><div class="sub">Care team · loading…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
