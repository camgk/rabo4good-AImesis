[project]
name = "aimesis-backend-workspace"
version = "0.1.0"
description = "AImesis Pediatric CINV Clinical Decision Support Backend Workspace"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "rules",
    "agent",
    "api",
]

[tool.uv.sources]
aimesis-rules = { workspace = true }
aimesis-agent = { workspace = true }
aimesis-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.4.6",
]

[tool.pytest.ini_options]
pythonpath = [
    "rules/src",
    "agent/src",
    "api/src",
]
asyncio_default_fixture_loop_scope = "function"
