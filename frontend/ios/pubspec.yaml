name: aimesis_ios
description: AImesis for families — one-tap nausea/vomiting logging and the CINV Patient Passport.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  aimesis_client:
    path: ../shared/aimesis_client
  aimesis_a2ui_catalog:
    path: ../shared/aimesis_a2ui_catalog

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true
