[project]
name = "aimesis-rules"
version = "0.1.0"
description = "Pure Python deterministic UZA v2 & POGO 250111 rules engine for pediatric CINV"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimesis_rules"]
